---
- name: Fail if required Beszel settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - beszel_uid
    - beszel_gid
    - beszel_hostname
    - beszel_path_prefix
    - beszel_container_network

# We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
- name: Fail if beszel_path_prefix ends with a slash
  ansible.builtin.fail:
    msg: >-
      beszel_path_prefix (`{{ beszel_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/beszel`).
  when: "beszel_path_prefix != '/' and beszel_path_prefix[-1] == '/'"

- name: Fail if only one of the initial user settings for Beszel is defined
  ansible.builtin.fail:
    msg: >-
      You need to define both `beszel_environment_variable_user_email` and `beszel_environment_variable_user_password`, or neither of them.
  when: >-
    (beszel_environment_variable_user_email | string | length == 0)
    != (beszel_environment_variable_user_password | string | length == 0)

- name: Fail if the agent socket host path for Beszel is missing when the agent socket is enabled
  ansible.builtin.fail:
    msg: >-
      You need to define `beszel_agent_socket_path_host` when `beszel_agent_socket_enabled` is `true`.
  when: "beszel_agent_socket_enabled | bool and beszel_agent_socket_path_host | string | length == 0"

- name: Run if Traefik is enabled
  when: beszel_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Beszel are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - beszel_container_labels_traefik_hostname
        - beszel_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `beszel_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if beszel_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          beszel_container_labels_traefik_path_prefix (`{{ beszel_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/beszel`).
      when: "beszel_container_labels_traefik_path_prefix != '/' and beszel_container_labels_traefik_path_prefix[-1] == '/'"
