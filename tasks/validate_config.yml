---
- name: Fail if required Beszel hub settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - beszel_hub_uid
    - beszel_hub_gid
    - beszel_hub_hostname
    - beszel_hub_path_prefix
    - beszel_hub_container_network

# We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
- name: Fail if beszel_hub_path_prefix ends with a slash
  ansible.builtin.fail:
    msg: >-
      beszel_hub_path_prefix (`{{ beszel_hub_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/beszel`).
  when: "beszel_hub_path_prefix != '/' and beszel_hub_path_prefix[-1] == '/'"

- name: Fail if only one of the initial user settings for Beszel hub is defined
  ansible.builtin.fail:
    msg: >-
      You need to define both `beszel_hub_environment_variable_user_email` and `beszel_hub_environment_variable_user_password`, or neither of them.
  when: >-
    (beszel_hub_environment_variable_user_email | string | length == 0)
    != (beszel_hub_environment_variable_user_password | string | length == 0)

- name: Fail if the agent socket host path for Beszel hub is missing when the agent socket is enabled
  ansible.builtin.fail:
    msg: >-
      You need to define `beszel_hub_agent_socket_path_host` when `beszel_hub_agent_socket_enabled` is `true`.
  when: "beszel_hub_agent_socket_enabled | bool and beszel_hub_agent_socket_path_host | string | length == 0"

- name: Run if Traefik is enabled
  when: beszel_hub_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Beszel hub are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - beszel_hub_container_labels_traefik_hostname
        - beszel_hub_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `beszel_hub_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if beszel_hub_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          beszel_hub_container_labels_traefik_path_prefix (`{{ beszel_hub_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/beszel`).
      when: "beszel_hub_container_labels_traefik_path_prefix != '/' and beszel_hub_container_labels_traefik_path_prefix[-1] == '/'"

# TSDProxy always serves the hub at the root of `https://<name>.<tailnet>.ts.net`,
# while the Beszel hub derives the base path of its web UI from `APP_URL`.
- name: Fail if TSDProxy is enabled for Beszel hub while it is hosted under a subpath
  ansible.builtin.fail:
    msg: >-
      `beszel_hub_container_labels_tsdproxy_enabled` requires `beszel_hub_path_prefix` to be `/` (currently `{{ beszel_hub_path_prefix }}`).
      TSDProxy serves the hub at the root of its tailnet hostname, while the Beszel hub builds the URLs of its web UI from `APP_URL`.
  when: "beszel_hub_container_labels_tsdproxy_enabled | bool and beszel_hub_path_prefix != '/'"
